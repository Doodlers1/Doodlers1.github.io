<h1>LiveBot</h1>
<p>LiveBot is a personal tool that runs on its owner's own computer. It keeps a small status file ("LiveBot feed.json") up to date in the owner's own Google Drive, so the owner can see that status on their phone.</p>
<p>It is not a public service: only its owner signs in to it.</p>
